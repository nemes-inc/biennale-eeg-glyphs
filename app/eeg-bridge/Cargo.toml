[package]
name = "eeg-bridge"
version = "0.1.0"
edition = "2021"
description = "Single-headband Muse BLE → inference server bridge with live raw + reconstructed overlay"
license = "LICENSE"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_plot = "0.29"
log = "0.4"
env_logger = "0.11"
muse-rs = { path = "..", default-features = false }
rustfft = "6"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
] }
