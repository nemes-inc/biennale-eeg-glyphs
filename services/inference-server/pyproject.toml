[project]
name = "eeg-inference-server"
version = "0.1.0"
description = "TCP inference server: receives EEGM frames, runs ZUNA GPU inference, returns reconstructed EEG"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "torch>=2.0",
    "zuna",
]

[project.scripts]
eeg-inference-server = "inference_server.server:main"
